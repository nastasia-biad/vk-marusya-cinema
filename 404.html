<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VK Marusya Cinema</title>
    <script>
        // Автоматический редирект на версию с хэшем
        const path = window.location.pathname;
        if (path.includes('vk-marusya-cinema') && !window.location.hash) {
            // Сохраняем путь для маршрутизации
            const redirectPath = path.replace('/vk-marusya-cinema', '') || '/';
            window.location.replace('/vk-marusya-cinema/#' + redirectPath);
        }
    </script>
</head>
<body>
    <noscript>
        <h1>VK Marusya Cinema</h1>
        <p>Для работы приложения требуется JavaScript.</p>
        <p>Перейдите по <a href="/vk-marusya-cinema/#/">ссылке с поддержкой хэша</a>.</p>
    </noscript>
</body>
</html>
